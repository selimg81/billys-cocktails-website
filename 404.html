  <style>
    .error-section {
      min-height: 100svh;
      display: flex; align-items: center; justify-content: center;
      background: var(--petrol);
      text-align: center;
      padding: clamp(80px, 12vw, 140px) clamp(20px, 4vw, 60px);
    }
    .error-inner { max-width: 560px; }
    .error-code {
      font-family: var(--f-display);
      font-size: clamp(100px, 20vw, 180px);
      font-weight: 300;
      color: rgba(255,255,255,0.12);
      line-height: 1;
      margin: 0;
      letter-spacing: -4px;
    }
    .error-h1 {
      font-family: var(--f-display);
      font-size: clamp(28px, 5vw, 44px);
      font-weight: 300;
      color: #fff;
      margin: 0 0 16px;
    }
    .error-h1 em { font-style: italic; color: var(--sand); }
    .error-p {
      font-size: 16px;
      color: rgba(255,255,255,0.65);
      line-height: 1.7;
      margin: 0 0 40px;
    }
    .error-btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .btn-white {
      background: #fff; color: var(--petrol);
      padding: 14px 32px; border-radius: 100px;
      font-size: 14px; font-weight: 600;
      transition: all 0.3s;
    }
    .btn-white:hover { background: var(--warm); transform: translateY(-2px); }
    .btn-ghost {
      background: transparent; color: rgba(255,255,255,0.8);
      border: 1.5px solid rgba(255,255,255,0.3);
      padding: 14px 32px; border-radius: 100px;
      font-size: 14px; font-weight: 500;
      transition: all 0.3s;
    }
    .btn-ghost:hover { border-color: #fff; color: #fff; transform: translateY(-2px); }
